[package]
name = "lauren-chatbot"
version = "0.1.0"
edition = "2021"

[dependencies]
agtrs = { path = "../agtrs/agtrs", features = ["axum"] }
injectable = { path = "../injectable/injectable", features = ["axum"] }
# Re-exported by macros — must be direct deps for macro-generated code
injectable-runtime = { path = "../injectable/injectable-runtime" }
injectable-graph = { path = "../injectable/injectable-graph" }
agtrs-runtime = { path = "../agtrs/agtrs-runtime" }
agtrs-graph = { path = "../agtrs/agtrs-graph" }
inventory = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"

[dev-dependencies]
